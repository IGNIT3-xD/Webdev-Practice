<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>LBC Bangla</title>
</head>

<body>
    <nav class="bg-red-800 p-5">
        <span class="text-2xl font-medium border p-2 bg-white">LBC</span> <span
            class="text-2xl text-white font-bold mx-1">বাংলা</span>
    </nav>

    <div class="w-11/12 mx-auto">
        <ul id="menu-li" class="flex gap-5 lg:gap-10 my-5 flex-wrap">

        </ul>
    </div>

    <main class="w-11/12 mx-auto">
        <h1 id="heading" class="text-2xl font-medium my-10"></h1>
        <div class="lg:grid grid-cols-4 gap-5">
            <div id="news-container" class="lg:col-span-3 grid grid-cols-2 gap-5 lg:grid-cols-3">
                <div class="col-span-2 lg:col-span-3 flex items-center justify-center">
                    <span class="loading loading-spinner text-error w-16"></span>
                </div>
            </div>

            <div class="lg:col-span-1 border border-gray-100 rounded-sm p-3 my-5 lg:my-0">
                <h1 class="font-medium text-2xl text-red-700">Bookmarks</h1>
                <div id="bkmark-container">

                </div>
            </div>
        </div>

        <!-- Open the modal using ID.showModal() method -->
        <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
        <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">
                <div id="modal-container">
                    
                </div>
                <div class="modal-action">
                    <form method="dialog">
                        <!-- if there is a button in form, it will close the modal -->
                        <button class="btn">Close</button>
                    </form>
                </div>
            </div>
        </dialog>
    </main>

    <script src="script.js"></script>
</body>

</html>
