<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tailwind.init.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Cart Angel</title>
</head>

<body class="bg-[#212121]">
    <section class="w-11/12 mx-auto my-5 grid md:grid-cols-4 gap-10 md:gap-5">
        <!-- Products -->
        <div id="products" class="grid grid-cols-1 md:grid-cols-3 gap-10 md:col-span-3">
            <!-- Product 1 -->
            <div class="bg-white shadow-lg rounded-xl w-80 mx-auto md:w-64 md:h-[296px]">
                <figure class="p-5">
                    <img src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp" alt="Shoes"
                        class="rounded-xl" />
                </figure>
                <div class="text-center flex flex-col gap-3 px-5">
                    <h2 class="text-xl font-medium">Yellow Show</h2>
                    <p>Price: $<span class="font-medium">500</span> Tk</p>
                    <button class="add-to-cart-btn bg-blue-600 text-white py-2 rounded-xl cursor-pointer mb-3">Add To
                        Cart</button>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="bg-white shadow-lg rounded-xl w-80 mx-auto md:w-64 md:h-[296px]">
                <figure class="p-5">
                    <img src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp" alt="Shoes"
                        class="rounded-xl" />
                </figure>
                <div class="text-center flex flex-col gap-3 px-5">
                    <h2 class="text-xl font-medium">Green Show</h2>
                    <p>Price: $<span class="font-medium">300</span> Tk</p>
                    <button class="add-to-cart-btn bg-blue-600 text-white py-2 rounded-xl cursor-pointer mb-3">Add To
                        Cart</button>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="bg-white shadow-lg rounded-xl w-80 mx-auto md:w-64 md:h-[296px]">
                <figure class="p-5">
                    <img src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp" alt="Shoes"
                        class="rounded-xl" />
                </figure>
                <div class="text-center flex flex-col gap-3 px-5">
                    <h2 class="text-xl font-medium">Blue Show</h2>
                    <p>Price: $<span class="font-medium">400</span> Tk</p>
                    <button class="add-to-cart-btn bg-blue-600 text-white py-2 rounded-xl cursor-pointer mb-3">Add To
                        Cart</button>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="bg-white shadow-lg rounded-xl w-80 mx-auto md:w-64 md:h-[296px]">
                <figure class="p-5">
                    <img src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp" alt="Shoes"
                        class="rounded-xl" />
                </figure>
                <div class="text-center flex flex-col gap-3 px-5">
                    <h2 class="text-xl font-medium">Black Show</h2>
                    <p>Price: $<span class="font-medium">500</span> Tk</p>
                    <button class="add-to-cart-btn bg-blue-600 text-white py-2 rounded-xl cursor-pointer mb-3">Add To
                        Cart</button>
                </div>
            </div>

            <!-- Product 5 -->
            <div class="bg-white shadow-lg rounded-xl w-80 mx-auto md:w-64 md:h-[296px]">
                <figure class="p-5">
                    <img src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp" alt="Shoes"
                        class="rounded-xl" />
                </figure>
                <div class="text-center flex flex-col gap-3 px-5">
                    <h2 class="text-xl font-medium">White Show</h2>
                    <p>Price: $<span class="font-medium">1500</span> Tk</p>
                    <button class="add-to-cart-btn bg-blue-600 text-white py-2 rounded-xl cursor-pointer mb-3">Add To
                        Cart</button>
                </div>
            </div>
        </div>

        <!-- Cart -->
        <div class="md:col-span-1 md:h-screen overflow-auto">
            <h1 class="text-white text-2xl font-medium">Cart</h1>

            <div id="cart-container">
                <h1 id="empty" class="text-white font-xl my-5">No product added yet</h1>
            </div>
            <div class="bg-white rounded-lg my-4 p-4">
                <h4 id="total-price" class="font-medium text-xl">Total: $<span>0</span>Tk</h4>
            </div>
        </div>
    </section>

    <script src="./script.js"></script>
</body>

</html>
