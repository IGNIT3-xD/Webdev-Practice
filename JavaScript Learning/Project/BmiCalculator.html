<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body {
            background-color: #212121;
            color: whitesmoke;
        }

        nav {
            text-align: center;
            font-size: large;
            font-weight: 600;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-top: 16px;
        }

        form {
            text-align: center;
            margin: 42px;
        }

        form input {
            margin: 12px 6px;
            padding: 8px 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            color: #212121b2;
            font-weight: bold;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 80px;
        }
    </style>
</head>

<body>
    <nav>
        <a style="border: 2px solid lightblue; border-radius: 8px; padding: 6px; text-decoration: none; color: white;"
            href="./index.html">Home</a>
    </nav>
    <h1>BMI Calculator</h1>
    <form action="">
        <label for="height">Height (Cm) :</label>
        <input type="text" name="" id="height" placeholder="Enter Height"><br>
        <label for="weight">Weight (Kg) :</label>
        <input type="text" name="" id="weight" placeholder="Enter Weight"><br>
        <button type="submit">Calculate</button>
    </form>
    <p id="result" style="text-align: center; font-size: 22px; color: white;"></p>

    <script>
        const form = document.querySelector('form')

        form.addEventListener('submit', function (x) {
            x.preventDefault();

            const height = parseInt(document.querySelector('#height').value)
            const weight = parseInt(document.querySelector('#weight').value);
            const result = document.querySelector('#result');

            if (height === '' || height < 0 || isNaN(height)) {
                result.innerHTML = 'Please Enter a Valid Height';
            }
            else if (weight === '' || weight < 0 || isNaN(weight)) {
                result.innerHTML = 'Please Enter a Valid Weight'
            }
            else {
                let bmi = (weight / ((height * height) / 10000)).toFixed(2)
                result.innerHTML = `Your BMI = ${bmi}`
            }
        })
    </script>
</body>

</html>
