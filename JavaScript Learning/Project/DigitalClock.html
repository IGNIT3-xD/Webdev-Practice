<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body {
            background-color: #212121;
            color: white;
        }

        nav {
            text-align: center;
            font-size: large;
            font-weight: 600;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-top: 16px;
        }

        h1 {
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 80px;
            color: violet;
        }

        #clock {
            background-color: #ff00003b;
            width: 200px;
            height: 50px;
            border-radius: 6px;
            text-align: center;
            font-size: 22px;
            line-height: 50px;
            color: white;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <nav>
        <a style="border: 2px solid lightblue; border-radius: 8px; padding: 6px; text-decoration: none; color: white;"
            href="./index.html">Home</a>
    </nav>
    <h1>Digital Clock</h1>
    <div id="clock"></div>

    <script>
        const clock = document.getElementById('clock')

        setInterval(function () {
            let time = new Date()
            clock.innerHTML = time.toLocaleTimeString();
        }, 1000)
    </script>
</body>

</html>
